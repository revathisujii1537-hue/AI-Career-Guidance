<!DOCTYPE html>
<html>

<head>

<title>AI Resume Analysis</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    margin:0;
    padding:30px;
}


.container{

    max-width:900px;
    margin:auto;

}


.title{

    text-align:center;
    color:white;
    font-size:35px;

}


.card{

    background:white;
    padding:25px;
    margin:20px 0;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);

}


.card h2{

    color:#4f46e5;

}


.score{

    font-size:45px;
    font-weight:700;
    text-align:center;
    color:#10b981;

}


.box{

    padding:15px;
    border-radius:12px;
    background:#f8fafc;
    line-height:1.8;

}


button{

    background:#4f46e5;
    color:white;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;

}


button:hover{

    background:#3730a3;

}

</style>

</head>


<body>


<div class="container">


<h1 class="title">
🤖 AI Resume Analyzer
</h1>



<div class="card">

<h2>📊 ATS Score</h2>

<div class="score">
85%
</div>

</div>




<div class="card">

<h2>📄 AI Report</h2>

<div class="box">

{{ ai_result | safe }}

</div>


</div>




<div class="card">

<center>

<a href="/career-dashboard">

<button>
Back to Dashboard
</button>

</a>

</center>

</div>


</div>


</body>

</html>
