<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Full Career Report</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins,sans-serif;
    background:#0f172a;
    color:white;
    padding:40px;
}


.container{

    max-width:900px;
    margin:auto;
    background:#1e293b;
    padding:40px;
    border-radius:20px;

}


h1{
    color:#60a5fa;
}


.card{

    background:#334155;
    padding:25px;
    border-radius:15px;
    margin-top:20px;

}


.ai-result{

    line-height:1.8;
    font-size:16px;

}


button{

    margin-top:25px;
    padding:12px 25px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;

}

</style>

</head>


<body>


<div class="container">


<h1>📄 Full AI Career Report</h1>


<div class="card">

<h2>👤 Student Details</h2>

<p>
<b>Name:</b> {{ report[1] }}
</p>

<p>
<b>Degree:</b> {{ report[2] }}
</p>

<p>
<b>Skills:</b> {{ report[3] }}
</p>

<p>
<b>Interest:</b> {{ report[4] }}
</p>

<p>
<b>Dream Job:</b> {{ report[5] }}
</p>


</div>



<div class="card">

<h2>🎯 AI Recommendation</h2>


<div class="ai-result">

{{ report[8] | safe }}

</div>


</div>


<a href="/dashboard">

<button>
⬅ Back to Dashboard
</button>

</a>


</div>


</body>

</html>
